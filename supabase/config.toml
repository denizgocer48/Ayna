project_id = "ayna"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "ayna://"
additional_redirect_urls = ["ayna://"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_confirmations = true

# Kept enabled because the local stack's storage schema must exist for the
# initial migration to apply. Nothing is stored: analysis runs on the device and
# only derived measurements are uploaded, and migration 20260909010000 revokes
# every policy on the scans bucket. See docs/architecture.md.
[storage]
enabled = true
file_size_limit = "10MiB"
