[project]
name = "ayna-api"
version = "0.1.0"
description = "Ayna analysis service — landmark extraction, metric computation, scoring."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "numpy>=2.1",
    "opencv-python-headless>=4.10",
    "mediapipe>=0.10.18",
    "supabase>=2.9",
    "redis>=5.2",
    "celery>=5.4",
    "sentry-sdk[fastapi]>=2.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Wire-format mirrors of packages/shared: field names must match the TypeScript
# contract exactly, so camelCase here is deliberate.
"app/schemas.py" = ["N815"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
